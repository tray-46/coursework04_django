[project]
name = "coursework04-django"
version = "0.1.0"
description = "coursework04: django project"
authors = [
    {name = "tray",email = "at-box@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.2.0,<3.0.0)",
    "black (>=26.3.1,<27.0.0)"
]

[tool.black]
line-length=119
exclude='''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 119
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ['^venv',]
