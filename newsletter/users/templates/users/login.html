{% extends "mail_service/base.html" %}

{% block title %}Аутентификация{% endblock %}

{% block content %}
<div class="container">
    <div class="col-6">
        <h2>Вход на сайт</h2>
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Войти</button>
                    <a class="btn btn-primary" href="#" onclick="window.history.back()">Отмена</a>
                    <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
